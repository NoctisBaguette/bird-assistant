  make(assets,ratio,style,previous=null){

    const variant=(previous?.layoutVariant??Math.floor(Math.random()*10000))+1;
    const text=(id,value,x,y,width,size,extra={})=>({id,type:'text',contentTitle:'',text:value,x,y,w:width,h:size*2,fontSize:size,color:'#285c49',font:'serif',align:'left',rotation:0,...extra});
    const elements=[text('kicker','FIELD NOTES / '+T('羽迹','BIRD ASSISTANT'),w*.08,h*.055,w*.84,19*scale,{font:'sans',color:'#70816b'}),text('title',T('把每一次发现，留在纸上。','A little space for each encounter.'),w*.08,h*.105,w*.84,23*scale,{contentTitle:title,titleSize:46*scale})];
    const n=assets.length,top=h*.24,bottom=h*.92,rows=Math.ceil(n/2),gap=h*.035,rh=(bottom-top-gap*(rows-1))/rows;
    assets.forEach((a,i)=>{
      let x=w*(i%2?.53:.08),y=top+Math.floor(i/2)*(rh+gap),pw=w*.38;if(n===1){x=w*.12;pw=w*.76;}
      let ph=Math.max(80,rh-60*scale);

        const layout=[[.08,.25,.48,.29],[.65,.31,.27,.18],[.12,.65,.32,.20],[.53,.60,.38,.27]][i];
        x=w*layout[0];y=h*layout[1];pw=w*layout[2];ph=h*layout[3];
      }
      if(variant%2&&n>1)x=w-x-pw;
      const instance=a.instanceId||a.id+'-'+i,old=previous?.elements.find(e=>e.id==='caption-'+instance);
      if(n===4&&variant%3===0){y+=h*(i%2?-.025:.015);ph*=.94;}
      elements.push({id:a.elementId||'photo-'+instance,type:'photo',photoNumber:a.photoNumber||i+1,src:a.src,iw:a.width,ih:a.height,asset:J.copy(a),x,y,w:pw,h:ph,rotation:style==='nature'?((i+variant)%2?3:-3):0,crop:J.copy(a.savedCrop||{zoom:1,x:.5,y:.5})});
      elements.push(text('caption-'+instance,old?.text||a.label+(J.s.includeNotes&&a.notes?'\n'+a.notes:''),x,y+ph+17*scale,pw,24*scale,{font:'hand',color:'#4d6254',contentTitle:old?.contentTitle||'',photoId:a.elementId||'photo-'+instance}));
    });
    if(style==='magazine'){elements[0].text='THE OUTDOOR EDIT / '+T('本期发现','FIELD EDITION');elements[1].font='sans';elements.push({id:J.id(),type:'tape',x:w*.66,y:h*.225,w:w*.2,h:35*scale,rotation:6,color:'#b7be90'});}
    if(style==='nature')elements.push({id:J.id(),type:'leaf',x:w*.80,y:h*.045,w:w*.09,h:w*.09,rotation:12,color:'#839771'});
    if(previous){
      const sx=w/previous.width,sy=h/previous.height;
      for(const old of previous.elements.filter(e=>e.type==='text')){
        const item=elements.find(e=>e.id===old.id);
        if(item){Object.assign(item,{text:old.text,contentTitle:old.contentTitle||'',font:old.font,color:old.color,align:old.align,fontSize:old.fontSize*sx,titleSize:old.titleSize?old.titleSize*sx:undefined});}

      }
    }
    return J.migrate({schemaVersion:2,layoutVariant:variant,layoutEngine:'local-composition-v1',nextPhotoNumber:Math.max(0,...elements.filter(e=>e.type==='photo').map(e=>e.photoNumber))+1,id:previous?.id||J.id(),title,ratio,style,width:w,height:h,background:{color:style==='minimal'?'#ffffff':style==='magazine'?'#eee8da':'#f5efdf',texture:style==='nature',image:''},elements,sources:assets.map(J.copy),origin:previous?.origin||'manual',period:J.s.period,createdAt:previous?.createdAt||new Date().toISOString(),updatedAt:new Date().toISOString()});
  },

  update(input){

      if(props[name])e[props[name]]=['jFontSize','jTitleSize','jX','jY','jRotation'].includes(name)?Number(value):value;
      else if(name==='jWidth'){const k=Number(value)/e.w;e.w=Number(value);if(e.type!=='text')e.h*=k;}

时保持未知，不套用当前天气或位置。你可以在保存前补充。','Unknown capture time and place stay unknown. Current weather or location is not substituted; add details before saving.'))}</div>`;

  review(){

    return `<div class="pad r-page"><div class="eyebrow">${T('拍到的先留住，鸟名慢慢核对','Keep the capture; review the species')}</div><h1 class="page-title">${T('复核这次发现','Review this encounter')}</h1><p class="sub">${T('勾选要保留的素材。自动候选需你确认；收藏与公开分享以后分别选择。','Choose evidence to keep. Recovery candidates need your confirmation; collection and sharing remain separate.')}</p>${s.assets.some(a=>a.origin==='recovery')?note(T('补救示例：最多两张预览质量候选，默认未选中，不是原画回放。','Recovery sample: two preview-quality candidates, unselected by default; not full-quality replay.'),'warm'):''}${s.assets.length?R.assetList():note(T('还没有素材。可以继续拍摄，或从相册和文件导入。','No evidence yet. Continue capturing or import gallery/files.'))}<div class="r-section-head"><strong>${T('识别线索','Identification clues')}</strong><span class="pill">${T('模拟结果','Simulated')}</span></div>${s.analysis==='busy'?`<div class="r-analysis-pending" role="status">${T('正在演示分析所选素材…','Simulating analysis of selected evidence…')}${btn(T('取消，保留素材','Cancel and keep evidence'),'r-cancel-analysis','quiet small')}</div>`:s.analysis==='error'?`${note(T('识别暂未完成；素材和选择仍保留，可重试或保存待鉴定。','Identification did not finish. Evidence and choices remain; retry or save unresolved.'),'error')}${btn(T('重试示例分析','Retry sample analysis'),'r-analyse','secondary wide')}`:btn(s.analysis==='done'?T('重新分析所选素材（示例）','Reanalyse selection (sample)'):T('分析所选素材（示例）','Analyse selection (sample)'),'r-analyse','secondary wide',chosen.length?'':'disabled')}${s.analysis==='done'?r?.empty?note(T('暂无可靠候选，可以直接保存为待鉴定。','No reliable candidate. You can save unresolved.'),'warm'):`<div class="r-findings">${hasVisual?`<p><span>${T('视觉线索','Visual clue')}</span><b>${sp(r?.visualSpecies||'sparrow')} · ${r?.visualScore||86}%</b><small>${T('示例匹配度，非正确率','Sample match, not accuracy')}</small></p>`:''}${hasAudio?`<p><span>${T('声音线索','Audio clue')}</span><b>${sp(s.audioClue?.species||(r?.disagree?'tit':'sparrow'))}</b><small>${r?.disagree?T('可能来自另一只鸟；不合并分数','May be another bird; scores kept separate'):s.audioClue&&!chosen.some(a=>a.kind==='sound'||a.kind==='video')?T('近期声音判断 · 未保留音频文件','Recent audio clue · no audio file retained'):T('视频音轨 / 音频示例','Video soundtrack / audio sample')}</small></p>`:''}</div>`:note(T('尚未分析。可先保存，鸟种保持待鉴定。','Not analysed yet. Save first with species unresolved.'))}${R.nameChoice()}<div class="r-review-bottom">${btn(T('继续，保存私人观察','Continue to private record'),'r-save','wide',chosen.length?'':'disabled')}${btn(T('继续取景','Continue capturing'),'r-live','quiet wide')}${btn(T('再导入素材','Import more'),'r-import','quiet wide')}</div>${note(T('本原型的素材与观察仅在当前会话保留；不代表已写入手机相册或云端。','Evidence and observations in this prototype are session-only; no phone album or cloud save occurs.'))}</div>`;
  },
  openReview(){clearTimeout(R.holdTimer);if(R.s.phase==='live'&&R.s.audio&&S.scenario!=='audio-denied')R.s.audioClue={sample:true,species:S.scenario==='live-disagree'?'tit':'sparrow',association:'unconfirmed',windowSeconds:3};R.s.finish(S.scenario);push('recognitionReview');},
  capture(kind='photo'){
    const a=R.s.capture(kind,S.scenario);if(a&&kind!=='sound'){const clue=R.sampleResult();a.visualClue={sample:true,species:clue.code,score:clue.score};}if(a&&R.s.audio&&S.scenario!=='audio-denied')R.s.audioClue={sample:true,species:S.scenario==='live-disagree'?'tit':'sparrow',association:'unconfirmed',windowSeconds:3};if(!a){toast(T('本次素材已达上限，请先复核','Review the current evidence before capturing more'));return;}
    renderApp();toast(kind==='sound'?T('已保留一段鸟鸣示例，可在素材中复核','Bird-call sample retained for review'):a.album==='failed'?T('示例拍摄完成；相册保存失败，素材仍保留','Sample captured; album save failed, evidence retained'):T('示例拍摄完成，点击右侧复核素材','Sample captured. Review with the right-hand button.'));
  },
  analyse(){const token=R.s.beginAnalysis();if(token===null)return;renderApp();clearTimeout(R.analysisTimer);R.analysisTimer=setTimeout(()=>{if(R.s.complete(token,S.scenario)&&S.view.name==='recognitionReview')renderApp();},850);},
  action(a,id,node){
    if(!a.startsWith('r-'))return false;
    const s=R.s;
    if(a==='r-keep-audio'){R.capture('sound');return true;}
    if(a==='r-record-evidence'){push('recognitionPreview',{id,recordId:node.dataset.recordId});return true;}
    if(a==='r-mode'){s.mode=id;s.helpOpen=false;}
    if(a==='r-mode-help')s.helpOpen=!s.helpOpen;
    if(a==='r-help-close')s.helpOpen=false;
    if(a==='r-focus')s.focusOn(id);
    if(a==='r-evidence-expand')s.detailsOpen=!s.detailsOpen;
    if(a==='r-adopt-name'){s.chooseName(id);s.manualOpen=false;}
    if(a==='r-clear-name')s.chooseName('');
    if(a==='r-manual-name')s.manualOpen=!s.manualOpen;
    if(a==='r-pause'){if(s.recording)s.capture('video',S.scenario);s.phase='paused';}
    if(a==='r-resume'){s.phase='live';}
    if(a==='r-live'){s.phase='live';s.recovered=false;goTab('identify');return true;}
    if(a==='r-import'){if(s.recording)s.capture('video',S.scenario);s.invalidate();push('recognitionImport');return true;}
    if(a==='r-import-kind')s.importKind=id;
    if(a==='r-choose-file'){$(s.importKind==='audio'?'#recognition-audio-input':'#recognition-media-input').click();return true;}
    if(a==='r-sample'){if(s.assets.length>=6){toast(T('本次最多保留 6 份素材，请先复核','Review the current six items first'));return true;}s.add(id,'import',{duration:id==='video'?12:id==='sound'?6:0,...(id==='photo'?{}:{segment:{from:0,to:id==='video'?12:6}})});s.invalidate();}
    if(a==='r-review'){R.openReview();return true;}
    if(a==='r-preview'){push('recognitionPreview',{id});return true;}
    if(a==='r-remove'){const asset=s.assets.find(x=>x.id===id);s.remove(id);if(asset?.url&&!S.records.some(r=>r.media?.url===asset.url||r.evidence?.some(e=>e.url===asset.url))){URL.revokeObjectURL(asset.url);R.urls.delete(asset.url);}}
    if(a==='r-toggle-asset')s.toggle(id);
    if(a==='r-zoom')s.zoom=Number(id);
    if(a==='r-audio')s.audio=!s.audio;
    if(a==='r-album'){const asset=s.assets.find(x=>x.id===id);if(asset){asset.album=['low-storage','album-denied'].includes(S.scenario)?'failed':'sample-saved';toast(asset.album==='failed'?T('示例仍无法保存相册；请保留当前素材','Sample album save still failed; evidence retained'):T('示例相册状态已更新','Sample album state updated'));}}
    if(a==='r-analyse'){R.analyse();return true;}
    if(a==='r-cancel-analysis'){s.invalidate();clearTimeout(R.analysisTimer);}
    if(a==='r-leave-recording'){const target=S.dialog.target;s.capture('video',S.scenario);finishLeave(target);return true;}
    if(a==='r-save'){
      const chosen=s.chosen();if(!chosen.length)return true;const analysisDone=s.analysis==='done',result=s.result;s.invalidate();
      const cover=chosen.find(x=>x.kind==='photo')||chosen[0];
      S.input={id:'bundle-'+Date.now(),media:R.sampleMedia(cover),bundle:chosen.map(x=>({...x})),audioClue:s.audioClue?{...s.audioClue}:null,assessment:analysisDone?{demo:true,model:'demo-multimodal-v1',items:result?.empty?[]:[{species:result?.visualSpecies||'sparrow',score:(result?.visualScore||86)/100}],sourceState:'normal',audioVisualDisagree:!!result?.disagree}:null};
      S.forms.candidates={manual:'',selected:s.selection};delete S.forms.save;startSave();return true;
    }
    renderApp();return true;
  },
  bind(){
    clearInterval(R.timer);clearInterval(R.recordTimer);R.recordTimer=null;
    document.querySelectorAll('.r-media-preview,.r-audio-player').forEach(media=>media.addEventListener('error',()=>{const error=$('.r-playback-error');if(error){error.hidden=false;error.textContent=T('此文件无法在当前浏览器播放。素材仍保留，可换用其他文件。','This browser cannot play this file. Evidence is retained; try another file.');}}));
    document.querySelectorAll('[data-r-trim]').forEach(input=>input.addEventListener('change',()=>{const a=R.s.assets.find(a=>a.id===S.view.id),from=Number($('[data-r-trim=from]').value),to=Number($('[data-r-trim=to]').value);if(!R.s.setSegment(a?.id,from,to)){toast(T('请选择有效的起止时间','Choose a valid time range'));input.value=a?.segment?.[input.dataset.rTrim]??(input.dataset.rTrim==='from'?0:Math.min(a?.duration||0,15));}}));
    document.querySelectorAll('.r-media-preview,.r-audio-player').forEach(media=>{const a=R.s.assets.find(a=>a.id===S.view.id);const ready=()=>{if(!a||!Number.isFinite(media.duration)||media.duration<=0)return;a.duration=media.duration;a.segment||={from:0,to:Math.min(a.duration,15)};const duration=$('.r-duration');if(duration)duration.textContent=T('总时长 ','Duration ')+a.duration.toFixed(1)+' s';document.querySelectorAll('[data-r-trim]').forEach(input=>{input.disabled=false;input.max=a.duration;input.value=a.segment[input.dataset.rTrim];});};media.addEventListener('loadedmetadata',ready);if(media.readyState>=1)ready();});

    if(kind==='chat')return `<div class="snapshot"><h3>${T('私聊 · 和鸟友继续讨论','Direct chat · continue with a friend')}</h3><p>${T('第一版建议仅双向好友可发起。文字、观察卡片与手帐分享逐步加入；分享卡片只带用户明确选中的公开内容。','Start with mutual friends. Add text, observation cards and journals in stages; shared cards include only explicitly chosen public content.')}</p></div><div class="snapshot"><h3>${T('群聊 · 为一次约鸟建立小群','Group chat · plan an outing')}</h3><p>${T('邀请加入、管理员管理、群公告、静音和退群。不会因好友关系自动拉人，也不默认公开精确活动地点。','Invitation-based membership, admins, announcements, mute and leave. Friendship does not automatically add people or disclose precise meeting locations.')}</p></div>${note(T('开发边界：待发送 / 已发送 / 失败重试、未读、离线恢复，以及屏蔽与举报，都应先确定。现在先明确流程，真实消息服务后续接入；本页不会发送消息。','Define pending/sent/failed and retry, unread state, offline recovery, blocking and reporting first. Messaging infrastructure follows later; this page sends no messages.'))}`;
    return `<div class="snapshot"><h3>${T('第一版：记录习惯与个人里程碑','First version: habits and personal milestones')}</h3><p>${T('初次保存自己的观察、补充行为/环境笔记、完成第一份手帐。待鉴定与私人记录同样有效；徽章不证明鉴定正确，也不决定专家身份。','Save a first observation, add behavioural or habitat notes, and finish a first journal. Private and unresolved records count; badges do not certify identification accuracy or expertise.')}</p></div>${growthConcept()}${note(T('建议先做轻量里程碑；庭院、羽叶及知识练习保持提案，不先锁定数值。更新同一份记录不重复计奖，不以公开打卡、发布量或稀有鸟作为奖励条件。','Start with simple milestones. Keep the garden, feather leaves and learning exercises as proposals without fixed reward values. Editing a record earns no duplicate reward; public check-ins, post volume and rare birds are not reward conditions.'))}`;
  },
  action(a,id){
    if(!a.startsWith('x-'))return false;
    if(a==='x-avatar-upload')$('#avatar-photo-input').click();
    if(a==='x-avatar-template'){X.loadToken++;S.forms.profile.avatar=X.template(id);S.forms.profile.avatarEdit=null;S.dirty.add('editProfile');renderApp();}
    if(a==='x-avatar-recrop')X.openCrop(S.forms.profile.avatarEdit);
    if(a==='x-avatar-left'||a==='x-avatar-right'){X.crop.rotation=(X.crop.rotation+(a==='x-avatar-right'?90:270))%360;renderApp();}
    if(a==='x-avatar-reset'){Object.assign(X.crop,{zoom:1,x:.5,y:.5,rotation:0});renderApp();}
    if(a==='x-avatar-cancel'){X.loadToken++;X.crop=null;X.image=null;finishLeave(null);}
    if(a==='x-avatar-use'){
      const canvas=document.createElement('canvas');canvas.width=512;canvas.height=512;
      if(!X.drawCrop(canvas)){toast(T('图片还未准备好，请稍后再试。','The image is not ready; try again shortly.'));return true;}
      S.forms.profile.avatar=canvas.toDataURL('image/jpeg',.92);S.forms.profile.avatarEdit=clone(X.crop);S.dirty.add('editProfile');X.crop=null;X.image=null;finishLeave(null);
    }
    if(a==='x-place-result'){chooseMapPlace(id);}
    if(a==='x-place-open'){goTab('home');chooseMapPlace(id);}
    if(a==='x-place-save'||a==='x-place-checkin'){
      const set=a==='x-place-save'?S.placeBookmarks:S.checkins;
      if(set.has(id)){set.delete(id);renderApp();toast(T('已撤回这条公开活动（示例）','Public activity withdrawn (sample)'));}
      else{S.dialog={kind:'placeActivity',id,activity:a==='x-place-save'?'save':'checkin'};renderApp();}
    }
    if(a==='x-place-confirm'){
      const d=S.dialog;if(S.scenario==='publish-error'){toast(T('模拟发布失败，未增加公开活动，可重试或取消。','Simulated publication failure; no public activity was added. Retry or cancel.'));return true;}
      (d.activity==='save'?S.placeBookmarks:S.checkins).add(d.id);S.dialog=null;renderApp();toast(T('已公开，私人观察未变化（示例）','Public activity added; private observations unchanged (sample)'));
    }
    return true;
  }
};

  <script>'use strict';

};

const species = {

let S, sequence=0, toastTimer, analysisTimer, audioTimer, audioContext;
const clone = x => structuredClone(x);
function sp(code){return species[code]?L(species[code]):code || L(species.unresolved);}
function place(loc){return loc?L(places[loc.place])+ (loc.custom?T(' · 自选点',' · selected point'):''):T('未添加地点','Location not added');}
function when(value){return value?esc(value.replace('T',' ')):T('观察时间未知','Observation time unknown');}
function myName(){return S.profile.name || 'Baguette';}
function author(obj){return obj.anonymous?T('匿名观鸟者','Anonymous observer'):obj.owner==='me'?myName():L(users[obj.owner]);}
function observedSpecies(){return new Set(S.records.filter(r=>r.owner==='me'&&r.species!=='unresolved').map(r=>r.species)).size;}
function initial(){
  const records=[
    {id:'a',owner:'lin',species:'sparrow',time:'2026-10-21T07:45',uploaded:'2026-10-21T08:10',location:{place:'lake',x:35,y:43,source:'selected'},weather:pair('晴，微风','Sunny, light breeze'),notes:pair('在湖边的灌木上停留。','Perched on a shrub by the lake.'),media:{kind:'photo',color:'#856b4b'},candidates:['sparrow','house']},
    {id:'b',owner:'mei',species:'tit',time:'2026-10-20T08:20',uploaded:'2026-10-20T09:10',location:{place:'wood',x:73,y:24,source:'selected'},weather:'',notes:pair('听到叫声后，在枝头看到了它。','Heard a call, then found it on a branch.'),media:{kind:'photo',color:'#627452'},candidates:['tit']},
    {id:'c',owner:'me',species:'kingfisher',time:'2026-10-18T09:30',uploaded:'2026-10-18T10:05',location:{place:'lake',x:59,y:65,source:'selected'},weather:'',notes:pair('留作自己的观察笔记。','Kept in my private field notes.'),media:{kind:'photo',color:'#55828a'},candidates:[],privateMarker:true},
    {id:'d',owner:'me',species:'unresolved',time:'2026-10-19T06:50',uploaded:'2026-10-19T07:05',location:null,weather:'',notes:pair('录下了线索，之后再核对。','Keep the clue and review it later.'),media:{kind:'sound',duration:3},candidates:['cuckoo','tit']}
  ];
  const publicPart=r=>({sourceId:r.id,owner:r.owner,species:r.species,time:r.time,location:clone(r.location),media:clone(r.media),notes:clone(r.notes),weather:clone(r.weather),anonymous:false,available:true});
  return {journal:J.state(),view:{name:'home'},history:[],tab:'home',records,pins:[{id:'pin-a',...publicPart(records[0])},{id:'pin-b',...publicPart(records[1])}],
    posts:[{id:'post-a',owner:'mei',title:pair('辨认一只鸟时，你会先看哪里？','What do you notice first when identifying a bird?'),body:pair('我正在练习先观察体形，再看颜色。大家觉得哪些特征最有帮助？','I am learning to notice shape before colour. Which features help you most?'),attachment:publicPart(records[0]),available:true,replies:[{owner:'lin',body:pair('可以先留意大小、嘴形和姿态。','Start with size, beak shape and posture.')}],likes:12}],
    collect:new Set(['c']),bookmarks:new Set(),likes:new Set(),friends:{lin:'friends',mei:'incoming',yue:'none'},
    map:{x:0,y:0,z:1,filter:'all',date:'all',species:'all',query:'',sheet:null,place:'lake',focusedPoi:null,searchOpen:false},placeBookmarks:new Set(),checkins:new Set(),collection:'mine',
    profile:{name:'Baguette',avatar:null},preferences:{anonymous:false},forms:{},dirty:new Set(),scenario:'normal',dialog:null,analysisToken:0,saveBusy:false,
    recognition:new RecognitionSession(),input:null,sound:{recording:false,duration:0,ready:false},selected:'unresolved'};
}
function reset(){X.loadToken++;X.crop=null;X.image=null;R.reset();clearTimeout(analysisTimer);clearInterval(audioTimer);clearTimeout(toastTimer);$('#toast').classList.remove('show');$('#toast').textContent='';S=initial();sequence=0;render();}
function bird(color='#856b4b'){
  return `<svg viewBox="0 0 220 150" role="img" aria-label="${T('鸟类示意插画','Illustrative bird artwork')}"><path d="M12 126q90-15 196 0" fill="none" stroke="#a29a75" stroke-width="5"/><path d="m95 110-7 15m25-14-1 13" stroke="#806c4c" stroke-width="3"/><path d="m80 79-44 23 40 5" fill="#5a5546"/><ellipse cx="113" cy="87" rx="47" ry="29" fill="${color}"/><path d="M74 83q38-14 64 17-30 13-64-17" fill="#d0c6a5"/><circle cx="147" cy="60" r="25" fill="${color}"/><path d="m167 59 21 6-23 6" fill="#bd9956"/><path d="M131 44q20-10 31 6l-1 7q-18-13-29-3" fill="#ead9b3"/><circle cx="155" cy="59" r="3.7" fill="#20382f"/><circle cx="156" cy="58" r="1" fill="white"/></svg>`;
}
function art(media,kind=''){
  if(media?.kind==='video')return `<div class="art ${kind}">${media.url?`<video src="${esc(media.url)}" controls playsinline preload="metadata" style="width:100%;max-height:300px"></video>`:bird(media.color)}<span class="caption">${T('视频素材','Video evidence')}${media.sample?T(' · 示例',' · sample'):''}</span></div>`;
  if(media?.journal)return `<div class="journal-post-image"><img src="${esc(media.url)}" alt="${T('手帐成品图','Journal image')}"></div>`;
  if(!media)return `<div class="art ${kind}"><span class="tiny">${T('未公开素材','No media shared')}</span></div>`;
  const thumb=kind.includes('thumb');
  if(media?.kind==='sound'&&media.url&&!thumb)return `<div class="art sound-art ${kind}"><audio controls preload="metadata" src="${esc(media.url)}" style="width:100%"></audio><span class="caption">${T('音频素材','Audio evidence')}</span></div>`;
  if(media?.kind==='sound')return `<div class="art sound-art ${kind}">${icon('sound')}<span class="caption">${thumb?T('声音','Audio'):T('合成示例声音','Synthetic sample sound')}</span></div>`;
  return `<div class="art ${kind}">${media?.url?`<img src="${esc(media.url)}" alt="${T('你选择的照片','Your selected photo')}">`:bird(media?.color)}<span class="caption">${media?.url?(thumb?T('照片','Photo'):T('已选照片','Selected photo')):(thumb?T('示例','Sample'):T('示例插画','Sample illustration'))}</span></div>`;
}
function status(code){return `<span class="pill ${code==='unresolved'?'pending':''}">${code==='unresolved'?sp(code):T('用户选择','User selected')}</span>`;}
function push(name,params={}){S.history.push(clone(S.view));S.view={name,...params};S.dialog=null;render();$('#app').scrollTop=0;}
function replace(name,params={}){S.view={name,...params};S.dialog=null;render();$('#app').scrollTop=0;}
function goTab(tab){S.tab=tab;S.view={name:tab};S.history=[];S.dialog=null;render();$('#app').scrollTop=0;}
function requestLeave(target){
  if(R.s.recording){S.dialog={kind:'recognitionLeave',target};render();return;}
  if(S.view.name==='journalEditor'&&J.s.modified){S.dialog={kind:'journalLeave',target};render();return;}
  if(S.view.name==='avatarCrop'){X.action('x-avatar-cancel');return;}
  if(S.dirty.has(S.view.name)){S.dialog={kind:'leave',target};render();return;}
  finishLeave(target);
}
function finishLeave(target){
  if(target?.tab)return goTab(target.tab);
  S.view=S.history.pop()||{name:S.tab};S.dialog=null;render();
}
function toast(text){clearTimeout(toastTimer);const node=$('#toast');node.textContent=text;node.classList.add('show');toastTimer=setTimeout(()=>node.classList.remove('show'),2800);}
function source(id){return S.records.find(r=>r.id===id&&r.owner==='me');}
function pin(id){return S.pins.find(p=>p.id===id&&p.available);}
function post(id){return S.posts.find(p=>p.id===id&&p.available);}
function currentRecord(){return S.view.kind==='pin'?pin(S.view.id):source(S.view.id);}
function recordRow(r,kind='pin',id=r.id){return `<button type="button" class="record" data-action="record" data-kind="${kind}" data-id="${id}">${art(r.media,'thumb')}<div class="info"><strong>${esc(sp(r.species))}</strong><p>${esc(place(r.location))} · ${when(r.time)}</p><p>${esc(author(r))}${kind==='source'?T(' · 私人记录',' · Private record'):''}</p></div>${icon('arrow')}</button>`;}
function availableBookmarks(){return [...S.bookmarks].map(k=>{const [type,id]=k.split(':');return {type,id,value:type==='pin'?pin(id):post(id)};});}

function mapData(){
  const publicPins=S.pins.filter(p=>p.available&&(S.map.date!=='week'||p.time>='2026-10-16')&&(S.map.species==='all'||p.species===S.map.species));
  const locs=S.map.filter==='mine'?[]:publicPins;
  return {locs,groups:{lake:locs.filter(p=>p.location.place==='lake'),wood:locs.filter(p=>p.location.place==='wood')},mine:S.records.filter(r=>r.owner==='me'&&r.privateMarker&&r.location)};
}
function mapMarkers(){
  const {locs,groups,mine}=mapData();
  const marker=(id,x,y,label,kind='group',title='')=>`<button type="button" class="map-pin ${kind}" style="left:${x}%;top:${y}%" data-action="map-marker" data-id="${id}" aria-label="${esc(title||label)}">${label}</button>`;
  let markers='';

  if(S.map.z<.9&&locs.length)markers+=marker('all',50,38,locs.length,'group',T('展开聚合观察','Expand grouped observations'));
  else for(const [id,rs]of Object.entries(groups))if(rs.length){const pos=id==='lake'?[35,43]:[73,24];markers+=marker(id,...pos,rs.length,'group',L(places[id])+T('观察记录',' observations'));}
  if(S.map.filter!=='public')for(const r of mine)markers+=marker('private-'+r.id,r.location.x,r.location.y,icon('pin'),'mine',T('我的私人标记','My private marker'));
  if(S.map.focusedPoi){const p=X.poi(S.map.focusedPoi);if(p)markers+=`<span class="map-target" style="left:${p.x}%;top:${p.y}%" aria-hidden="true">${icon('pin')}</span>`;}

}
function updateMapView(el){
  const node=el.querySelector('.map-world');if(!node)return;
  node.style.transform=`translate(${S.map.x}px,${S.map.y}px) scale(${S.map.z})`;
  node.style.setProperty('--map-zoom',S.map.z);
  const layer=node.querySelector('[data-map-markers]');if(layer)layer.innerHTML=mapMarkers();
  syncMapRegion(el);
}
function setMapZoom(value){const z=BirdUX.clamp(value,.7,2.5),ratio=z/S.map.z;S.map.x*=ratio;S.map.y*=ratio;S.map.z=z;}
function mapGeometry(el){const node=el?.querySelector('.map-world');return node?.offsetWidth&&node?.offsetHeight?{width:node.offsetWidth,height:node.offsetHeight}:null;}
function centerMapPoint(point){
  const el=$('[data-map]'),g=mapGeometry(el);if(!g)return;
  Object.assign(S.map,BirdUX.offsetFor(point,g.width,g.height,S.map.z));
}
function mapSummaryContents(){
  const {groups}=mapData(),id=S.map.focusedPoi||S.map.place;
  return `<div class="row between"><strong>${esc(X.name(id))}</strong><span class="pill">${groups[S.map.place]?.length||0} ${S.map.focusedPoi?T('条区域记录','area records'):T('条记录','records')}</span></div><p>${T('地图中心附近 · 点开查看地点与公开活动','Near the map centre · open place and public activity')}</p>`;
}
function syncMapRegion(el){
  const g=mapGeometry(el);if(!g)return;
  const point=BirdUX.centerAt(S.map,g.width,g.height,S.map.z);S.map.place=BirdUX.regionAt(point,S.map.place);
  const summary=el.querySelector('[data-map-summary]');if(summary){summary.innerHTML=mapSummaryContents();summary.dataset.id=S.map.place;}
  const selected=el.querySelector('[data-picker-place]');if(selected)selected.textContent=L(places[S.map.place]);

function mapSearchBox(picker){return `<form id="map-search" class="map-search">${icon('search')}<input name="placeQuery" value="${esc(S.map.query)}" placeholder="${T('搜地点，找一处新发现','Search a place to explore')}" aria-label="${T('搜索示例地点','Search example places')}" role="combobox" aria-autocomplete="list" aria-controls="place-result-list" aria-expanded="false" autocomplete="off"><button class="text-button" type="submit">${T('查找','Find')}</button><div class="place-suggestions" data-place-suggestions hidden></div></form>`;}
function showMapSuggestions(){
  const box=$('[data-place-suggestions]'),input=$('[name="placeQuery"]');if(!box||!input)return;
  const rows=BirdUX.search(input.value);S.map.query=input.value;S.map.searchOpen=true;
  X.searchIndex=Math.min(X.searchIndex,rows.length-1);
  box.hidden=false;box.innerHTML=`<div class="place-result-list" id="place-result-list" role="listbox" aria-label="${T('推荐地点','Suggested places')}">${rows.map((p,i)=>`<button type="button" role="option" id="place-option-${p.id}" class="place-result" data-action="x-place-result" data-id="${p.id}" aria-selected="${i===X.searchIndex}"><strong>${esc(L(p))}</strong><small>${T('示例地点','Sample place')}</small></button>`).join('')||`<p class="tiny">${T('暂无匹配地点，试试“湖畔”或“林间”。','No matching places. Try “lake” or “wood”.')}</p>`}</div>${rows.length>3?`<div class="place-suggestion-foot">${T('上下滑动查看更多地点','Scroll for more places')} · ${rows.length}</div>`:''}`;
  input.setAttribute('aria-expanded','true');
  if(X.searchIndex>=0)input.setAttribute('aria-activedescendant','place-option-'+rows[X.searchIndex].id);else input.removeAttribute('aria-activedescendant');

function closeMapSearch(){const box=$('[data-place-suggestions]'),input=$('[name="placeQuery"]');if(box)box.hidden=true;if(input){input.setAttribute('aria-expanded','false');input.removeAttribute('aria-activedescendant');}S.map.searchOpen=false;X.searchIndex=-1;}
function chooseMapPlace(id){
  const p=X.poi(id);if(!p)return;
  S.map.focusedPoi=id;S.map.place=p.region;S.map.query=L(p);S.map.z=Math.max(1.2,S.map.z);closeMapSearch();centerMapPoint(p);
  if(S.view.name==='home')S.map.sheet=p.region;renderApp();
}

map.date==='week'?'selected':''}>${T('近七天','Last seven days')}</option></select><select id="map-species" aria-label="${T('鸟种筛选','Species filter')}">${[['all',T('所有鸟种','All species')],...Object.keys(species).map(k=>[k,sp(k)])].map(([v,t])=>`<option value="${v}" ${S.map.species===v?'selected':''}>${t}</option>`).join('')}</select></div>`:''}</div><div class="map-controls">${[['zoom-in','plus',T('放大','Zoom in')],['zoom-out','minus',T('缩小','Zoom out')],['locate','locate',T('回到示例位置','Go to example location')]].map(([a,i,l])=>`<button type="button" data-action="${a}" aria-label="${l}">${icon(i)}</button>`).join('')}</div>${picker?`<div class="crosshair">${icon('pin')}</div><div class="picker-info"><strong data-picker-place>${esc(L(places[selectedPlace]))}</strong><p class="tiny">${T('拖动地图，让标记指向观察位置，再确认。这里使用示意坐标。','Move the map beneath the marker, then confirm. Coordinates are illustrative.')}</p><div class="row">${btn(T('使用示例当前位置','Use example current point'),'pick-current','secondary small')}${btn(T('确认这个位置','Confirm this point'),'pick-confirm','small')}</div></div>`:`<div class="map-legend">● ${T('公开观察','Public')}　◇ ${T('我的私人标记','My private marker')}</div><button type="button" class="map-summary" data-map-summary data-action="map-marker" data-id="${selectedPlace}">${mapSummaryContents()}</button>`}<div class="map-credit">${T('示意地图 · 虚构地点 · 演示数据','Illustrative map · fictional places · demo data')}</div>${!picker&&S.map.sheet?mapSheet(groups):''}</div>`;

function mapSheet(groups){
  const key=S.map.sheet;
  if(key.startsWith('private-'))return '';
  const rs=key==='all'?Object.values(groups).flat():groups[key]||[];
  return `<section class="map-sheet" aria-label="${T('地点观察列表','Place observations')}"><div class="handle"></div><div class="row between"><h2>${key==='all'?T('聚合范围内的观察','Grouped observations'):esc(X.name(S.map.focusedPoi||key))}</h2><button type="button" class="icon-button" data-action="sheet-close" aria-label="${T('关闭列表','Close list')}">${icon('close')}</button></div><p class="sub">${S.map.focusedPoi?esc(L(places[key]))+T('范围内 · ',' area · '):''}${rs.length} ${T('条公开观察，按观察日期排列；不是鸟的个体数量。','public observation records, ordered by observation date; not a count of birds.')}</p>${key==='all'?btn(T('放大查看各地点','Zoom into places'),'expand-cluster','secondary small'):X.publicPlaceActions(S.map.focusedPoi||key)}${rs.slice().sort((a,b)=>b.time.localeCompare(a.time)).map(r=>recordRow(r)).join('')||`<div class="empty">${T('此条件下暂无公开记录','No public records for these filters')}</div>`}</section>`;
}

function collectionPage(){
  const tabs=[['mine',T('我的','Mine')],['friends',T('好友','Friends')],['public',T('公开','Public')],['region',T('区域','Regional')],['saved',T('已保存','Saved')]];
  let body='';
  if(S.collection==='mine'){
    const rs=S.records.filter(r=>r.owner==='me'&&S.collect.has(r.id));
    const codes=[...new Set(rs.map(r=>r.species))];
    body=`<div class="grid">${codes.map(code=>{const group=rs.filter(r=>r.species===code);return `<button class="tile" type="button" data-action="species-collection" data-id="${esc(code)}">${art(group[0].media)}<div class="text"><strong>${esc(sp(code))}</strong><p>${group.length} ${T('次观察 · 仅自己可见','observations · private')}</p>${status(code)}</div></button>`;}).join('')}</div>${rs.length?'':empty(T('还没有加入收藏的观察。保存时可以勾选，也可稍后加入。','No collected observations yet. Add one while saving or afterwards.'))}`;
  }else if(S.collection==='saved')body=bookmarkList();
  else if(S.collection==='region'){
    const f=S.forms.regional||{place:'lake',date:'all'};S.forms.regional=f;
    const rs=S.pins.filter(p=>p.available&&p.location.place===f.place&&(f.date!=='week'||p.time>='2026-10-16'));
    body=`<form data-form="regional">${select(T('选择区域','Choose an area'),'place',Object.keys(places).map(k=>[k,L(places[k])]),f.place)}${select(T('观察日期范围','Observation dates'),'date',[['all',T('所有演示日期','All demo dates')],['week',T('近七天','Last seven days')]],f.date)}</form>${note(T('区域采用示例命名范围。真实边界与数据覆盖仍需调研；此处仅包含公开观察。','Areas use named demonstration boundaries. Real boundaries and coverage need investigation; only public records appear here.'))}<div class="pills"><span class="pill">${rs.length} ${T('条观察','records')}</span><span class="pill">${new Set(rs.filter(r=>r.species!=='unresolved').map(r=>r.species)).size} ${T('个已标注鸟种','labelled species')}</span></div>${rs.map(r=>recordRow(r)).join('')||empty(T('此区域与日期范围暂无记录','No records in this area and date range'))}`;
  }else{
    const ownerIds=S.collection==='friends'?Object.keys(S.friends).filter(k=>S.friends[k]==='friends'):['lin'];
    body=ownerIds.map(uid=>`<button class="record" type="button" data-action="shared-collection" data-id="${uid}"><div class="avatar">${esc(L(users[uid]).slice(0,1))}</div><div class="info"><strong>${esc(L(users[uid]))}${T('的观察收藏','’s observations')}</strong><p>${uid==='mei'?T('好友可见收藏','Friends-only collection'):T('公开收藏','Public collection')}</p></div>${icon('arrow')}</button>`).join('')||empty(T('暂无好友收藏，先去认识一位鸟友吧。','No friend collections yet. Connect with an observer first.'));
  }
  return `<div class="pad"><div class="eyebrow">${T('一点一点，留下羽迹','A growing field notebook')}</div><h1 class="page-title" style="margin-top:10px">${T('我的鸟类收藏','Collection')}</h1><p class="sub">${T('自己的观察，和想要再看一次的发现。','Your encounters, and discoveries worth revisiting.')}</p><div class="tabs">${tabs.map(([id,label])=>`<button type="button" data-action="collection-tab" data-id="${id}" class="${S.collection===id?'on':''}">${label}</button>`).join('')}</div>${body}${S.collection==='mine'?note(T('收藏可以保持私密。加入收藏不要求发布地图或论坛。','A collection can remain private. Collecting never requires map or forum publication.')):''}</div>`;
}
function empty(t){return `<div class="empty">${t}</div>`;}
function errorMessage(code){
  const messages={
    save_failed:pair('保存暂未完成。素材和填写内容已保留，可切换正常情景后重试。','Save did not complete. Evidence and entered details remain; retry under the normal scenario.'),
    missing_location_time:pair('请先确认观察地点与实际观察时间；私人原件仍可保留未知。','Confirm a location and observation time first; the private original can remain incomplete.'),
    publication_failed:pair('发布暂未完成，已保留表单。请稍后重试。','Publication failed. Your form is retained for retry.'),
    empty_post:pair('请写一点帖子内容，草稿仍然保留。','Write some post content; your draft remains available.'),
    post_failed:pair('发帖暂未完成。草稿和所选附件仍在，可重试。','Post failed. The draft and selected attachment are retained for retry.'),
    empty_reply:pair('请输入回复内容','Enter a reply'),reply_failed:pair('回复发送失败，草稿已保留，可重试。','Reply failed. The draft is retained for retry.'),empty_name:pair('显示名称不能为空','Display name cannot be empty')
  };
  return messages[code]?L(messages[code]):code;
}

}

function detailPage(){
  const r=currentRecord();if(!r)return unavailable();
  const own=S.view.kind!=='pin';
  return `<div class="pad">${art(r.media,'detail-art')}<div class="row between"><h1 class="page-title">${esc(sp(r.species))}</h1>${status(r.species)}</div><dl class="meta"><dt>${T('观察时间','Observed')}</dt><dd>${when(r.time)}</dd><dt>${T('观察地点','Place')}</dt><dd>${esc(place(r.location))}</dd><dt>${T('公开署名','Attribution')}</dt><dd>${!r.anonymous&&r.owner!=='me'?`<button type="button" class="text-button" data-action="observer" data-id="${r.owner}">${esc(author(r))}</button>`:esc(author(r))}</dd><dt>${T('天气','Weather')}</dt><dd>${esc(L(r.weather)||T('未知','Unknown'))}${r.weather?T('（用户填写）',' (user supplied)'):''}</dd></dl>${r.notes?note(esc(L(r.notes))):''}${own?note(T('这是你的私人原始记录。地图与论坛的公开副本分别管理。','This is your private original. Public map and forum copies are managed separately.')):''}${r.evidence?.length?`<div class="r-evidence-strip">${r.evidence.map(a=>`<button type="button" data-action="r-record-evidence" data-record-id="${r.id}" data-id="${a.id}">${esc(R.label(a))}</button>`).join('')}</div>`:''}${own&&r.audioClue?note(T('另有近期声音线索（示例），未确认与画面是同一只鸟。','A recent audio clue (sample) is retained; association with the visible bird is unconfirmed.')):''}${own&&r.assessment?assessmentDetails(r.assessment):''}<div class="actions">${r.media?.kind==='sound'&&!r.media.url?btn(T('回听合成示例','Replay synthetic sample'),'play-audio','secondary'):''}${own?`${btn(S.collect.has(r.id)?T('从收藏移除','Remove from collection'):T('加入我的收藏','Add to my collection'),'collect','secondary',`data-id="${r.id}"`)}${btn(T('发布到地图','Publish on map'),'map-publish','',`data-id="${r.id}"`)}${btn(T('用这次观察写帖子','Write a post with this record'),'new-post','quiet',`data-id="${r.id}"`)}${btn(T('编辑记录与管理发布','Edit record and publications'),'manage','quiet',`data-id="${r.id}"`)}${btn(r.privateMarker?T('移除我的私人标记','Remove my private marker'):T('标记在我的地图（仅自己）','Mark on my map privately'),'private-marker','quiet',`data-id="${r.id}"`)}`:btn(S.bookmarks.has('pin:'+r.id)?T('取消保存','Remove bookmark'):T('保存这条观察','Bookmark this observation'),'bookmark-pin','secondary',`data-id="${r.id}"`)}</div></div>`;
}
function assessmentDetails(a){return `<details class="score-guide"><summary>${T('保留的分析来源与候选（示例）','Retained analysis sources and candidates (sample)')}</summary><p>${T('当前鸟名是用户选择；以下保留当时的示例模型输出，不随更名改写。','The current label is user selected. The sample model output below is retained independently of later label changes.')}</p><p>${T('来源模型','Source model')}: ${esc(a.model)}</p>${a.items.length?a.items.map(item=>`<p>${esc(sp(item.species))} · ${T('示例模型分数','Sample model score')} ${esc(item.score)}</p>`).join(''):`<p>${T('当时没有可靠候选','There were no reliable candidates')}</p>`}<p>${a.sourceState==='source-conflict'?T('来源分歧情景；尚未确认鉴定','Source-disagreement scenario; identification remains unconfirmed'):a.sourceState==='source-error'?T('参考来源不可用情景','Reference-unavailable scenario'):T('正常示例情景','Normal sample scenario')}</p></details>`;}
function unavailable(){return `<div class="pad"><h1 class="page-title">${T('内容暂不可用','Content unavailable')}</h1>${empty(T('原内容可能已撤回或调整可见范围。私人原始资料不会在这里显示。','The original may have been withdrawn or restricted. Private source material is not exposed here.'))}${btn(T('返回','Back'),'back','secondary wide')}</div>`;}

cated retrieval matches')}</dd><dt>${T('社区参考库','Community reference library')}</dt><dd>${T('尚未接入；用户选择的标签不自动成为已复核样本','Not connected; a user-selected label is not automatically a reviewed example')}</dd><dt>${T('地点与日期','Place and date')}</dt><dd>${T('未用于本次示例排序；缺少这些信息仍可保存','Not used in this sample ranking; you can save without them')}</dd></dl>${note(T('公开分享、允许作为参考样本、允许训练模型是分别决定的用途。这里没有复用私人或未授权的用户素材。','Public sharing, reference-library reuse and model training are separate choices. No private or unauthorised user evidence is reused here.'))}${scoreGuide()}<div class="actions">${btn(T('返回候选并继续选择','Return to candidate selection'),'back')}${btn(T('仍不确定，保存待鉴定','Still unsure: save unresolved'),'skip-identification','secondary')}${btn(T('补充或更换素材','Add or replace evidence'),'review-input','quiet')}</div></div>`;

function startSave(editId=null){

  if(original){S.forms.save={id:original.id,species:original.species,time:original.time,location:clone(original.location),weather:L(original.weather),notes:L(original.notes),collect:S.collect.has(original.id),media:clone(original.media),evidence:clone(original.evidence||[]),audioClue:clone(original.audioClue||null),edit:true,candidates:clone(original.candidates)};}
  else if(!S.forms.save||S.forms.save.inputId!==S.input?.id){const f=S.forms.candidates||{};S.forms.save={id:'own-'+(++sequence),inputId:S.input?.id,species:f.manual.trim()||f.selected||'unresolved',time:'',location:null,weather:'',notes:'',collect:false,media:clone(S.input?.media||{kind:'photo'}),evidence:clone(S.input?.bundle||[]),audioClue:clone(S.input?.audioClue||null),candidates:S.input?.media.kind==='sound'?['cuckoo','tit']:['sparrow','house'],edit:false};}
  else if(!S.forms.save.edit){const f=S.forms.candidates||{};S.forms.save.species=f.manual?.trim()||f.selected||'unresolved';}
  S.forms.save.assessment=clone(original?original.assessment||null:S.input?.assessment||null);
  if(!original)S.forms.save.candidates=(S.input?.assessment?.items||[]).map(item=>item.species);
  push('save');
}

      oscillator.connect(gain);gain.connect(audioContext.destination);oscillator.start(start);oscillator.stop(start+.18);

  if(a==='manage'){push('manage',{id});return;}
  if(a==='edit-record'){startSave(id);return;}
  if(a==='new-post'){startPost(id||null);return;}
  if(a==='edit-post'){startPost(null,id);return;}
  if(a==='refresh-attachment'){refreshAttachment();S.dirty.add('compose');renderApp();return;}
  if(a==='confirm-post'){confirmPost();return;}
  if(a==='post'){push('post',{id});return;}
  if(a==='like'){S.likes.has(id)?S.likes.delete(id):S.likes.add(id);renderApp();return;}
  if(a==='bookmark-pin'||a==='bookmark-post'){const key=(a==='bookmark-pin'?'pin:':'post:')+id;S.bookmarks.has(key)?S.bookmarks.delete(key):S.bookmarks.add(key);render();toast(S.bookmarks.has(key)?T('已保存为书签，不计入本人观察的鸟种','Bookmarked; personal species count unchanged'):T('已取消书签','Bookmark removed'));return;}
  if(a==='bookmark-remove'){S.bookmarks.delete(id);renderApp();return;}
  if(a==='reply'){
    const f=S.forms.reply,p=post(S.view.id);if(!f.body.trim()){f.error='empty_reply';renderApp();return;}
    if(S.scenario==='publish-error'){f.error='reply_failed';renderApp();return;}
    p.replies.push({owner:'me',body:f.body.trim()});S.forms.reply={body:''};S.dirty.delete('post');renderApp();return;
  }
  if(a==='withdraw-pin'||a==='withdraw-post'){S.dialog={kind:a==='withdraw-pin'?'pin':'post',id};render();return;}
  if(a==='withdraw-confirm'){
    const d=S.dialog,entry=d.kind==='pin'?pin(d.id):post(d.id);if(entry)entry.available=false;S.dialog=null;
    if(S.view.name==='post')replace('community');else render();toast(T('已撤回该公开副本，私人原件仍保留','Public copy withdrawn; private original retained'));return;
  }
  if(a==='observer'){push('observer',{id});return;}
  if(a==='friends'){push('friends');return;}
  if(a==='place-activity'){push('placeActivity');return;}
  if(a==='friend-request'||a==='friend-cancel'||a==='friend-remove'||a==='friend-accept'||a==='friend-decline'){
    S.friends[id]=a==='friend-request'?'pending':a==='friend-accept'?'friends':'none';render();toast(T('演示关系已更新，未发送真实通知','Demo connection updated; no real notification sent'));return;
  }
  if(a==='edit-profile'){if(!S.forms.profile?.draftKept)S.forms.profile={name:myName(),avatar:S.profile.avatar,avatarEdit:clone(S.profile.avatarEdit||null)};else {delete S.forms.profile.draftKept;S.dirty.add('editProfile');}push('editProfile');return;}
  if(a==='save-profile'){
    const f=S.forms.profile;if(!f.name.trim()){f.error='empty_name';renderApp();return;}
    X.loadToken++;S.profile={name:f.name.trim(),avatar:f.avatar,avatarEdit:clone(f.avatarEdit||null)};S.dirty.delete('editProfile');replace('profile');toast(T('资料已更新','Profile updated'));return;
  }
  if(a==='cancel-profile'){X.loadToken++;S.dirty.delete('editProfile');delete S.forms.profile;finishLeave(null);return;}
  if(a==='settings'){push('settings');return;}
  if(a==='permissions'){push('permissions');return;}
  if(a==='save-preferences'){S.preferences.anonymous=!!S.forms.preferences.anonymous;S.dirty.delete('settings');toast(T('已保存，仅影响今后发布','Saved for future publications only'));return;}
  if(a==='cache'){push('cache');return;}
  if(a==='cache-confirm'){S.dialog={kind:'cache'};render();return;}
  if(a==='cache-done'){
    S.dialog=null;if(S.scenario==='publish-error'){toast(T('模拟清理失败，观察与原始资料未变化','Simulated clearing failed; records and originals are unchanged'));}else toast(T('模拟清理完成，观察与原始资料未变化','Simulated clearing complete; records and originals are unchanged'));render();return;
  }
  if(a.startsWith('candidate-')){push('candidate',{id:a.slice(10)});return;}
});

document.addEventListener('input',event=>{
  const input=event.target;
  if(input.name==='placeQuery'){X.searchIndex=-1;showMapSuggestions();return;}
  if(input.matches('[data-avatar-adjust]')){if(X.crop){X.crop[input.dataset.avatarAdjust]=Number(input.value);X.paintCrop();}return;}
  if(input.matches('[data-r-manual-name]')){R.s.chooseName(input.value);const label=$('[data-r-chosen-name]');if(label)label.textContent=sp(R.s.selection);return;}const form=input.closest('[data-form]');if(!form||!input.name)return;
  const key=form.dataset.form;S.forms[key] ||= {};
  S.forms[key][input.name]=input.type==='checkbox'?input.checked:input.value;
  const viewName=key==='profile'?'editProfile':key==='preferences'?'settings':key==='reply'?'post':key;
  S.dirty.add(viewName);
  if(key==='publish'&&$('#public-preview'))$('#public-preview').innerHTML=publicationPreview(S.forms.publish);
});
document.addEventListener('change',event=>{
  const input=event.target;
  if(input.matches('[data-r-select]')){R.s.toggle(input.dataset.rSelect);renderApp();return;}
  if(input.id==='scenario'){J.cancelVoice?.(true);R.s.invalidate();R.revision=0;S.scenario=input.value;renderReview();if(S.view.name==='journalEditor'||S.view.name.startsWith('recognition')||R.liveViews.has(S.view.name))renderApp();toast(T('评阅情景已切换；已有内容仍然保留','Review scenario changed; existing content is retained'));return;}
  if(['map-filter','map-date','map-species'].includes(input.id)){S.map[input.id.slice(4)]=input.value;S.map.sheet=null;renderApp();return;}
  const form=input.closest('[data-form]');if(!form)return;
  const key=form.dataset.form;S.forms[key] ||= {};S.forms[key][input.name]=input.type==='checkbox'?input.checked:input.value;
  if(key==='regional'){renderApp();return;}
  if(key==='compose'&&input.name==='recordId'){refreshAttachment();renderApp();return;}
  if((key==='publish'||key==='compose')&&input.type==='checkbox'){S.dirty.add(key);renderApp();return;}
});
document.addEventListener('submit',event=>{
  event.preventDefault();
  if(event.target.id==='map-search'){
    const rows=BirdUX.search(S.map.query);if(rows.length)chooseMapPlace(rows[Math.max(0,X.searchIndex)]?.id||rows[0].id);else{showMapSuggestions();toast(T('暂无匹配的示例地点','No matching example place'));}
  }
});
$('#photo-input').addEventListener('change',event=>{
  const file=event.target.files[0];if(!file)return;
  if(!['image/jpeg','image/png','image/webp'].includes(file.type)||file.size>6*1024*1024){toast(T('本次原型支持 6 MB 以内的 JPG、PNG 或 WebP 图片。请重选，原内容仍保留。','This prototype accepts JPG, PNG or WebP images up to 6 MB. Choose another; previous content remains.'));event.target.value='';return;}
  const reader=new FileReader();reader.onload=()=>{S.input={id:'input-'+(++sequence),media:{kind:'photo',url:reader.result}};delete S.forms.candidates;delete S.forms.save;push('photo');};reader.onerror=()=>toast(T('图片读取失败，请重选','Could not read the image; choose another'));reader.readAsDataURL(file);event.target.value='';
});

for(const id of ['recognition-media-input','recognition-audio-input'])$('#'+id).addEventListener('change',event=>{const files=[...event.target.files];event.target.value='';R.importFiles(files);});
document.addEventListener('visibilitychange',()=>{if(document.hidden){clearInterval(R.timer);clearInterval(R.recordTimer);R.recordTimer=null;clearTimeout(R.holdTimer);if(R.s.recording)R.s.capture('video',S.scenario);R.s.phase='paused';R.s.invalidate();}else if(R.liveViews.has(S.view.name))renderApp();});
window.addEventListener('blur',()=>{clearTimeout(R.holdTimer);if(R.s.recording){R.s.capture('video',S.scenario);renderApp();}});
function bindMap(){
  document.querySelectorAll('[data-map]').forEach(el=>{
    const pointers=new Map();let base=null;
    syncMapRegion(el);
    el.addEventListener('keydown',e=>{if(e.target!==el||!['ArrowLeft','ArrowRight','ArrowUp','ArrowDown'].includes(e.key))return;e.preventDefault();S.map.focusedPoi=null;S.map.x+=e.key==='ArrowLeft'?45:e.key==='ArrowRight'?-45:0;S.map.y+=e.key==='ArrowUp'?45:e.key==='ArrowDown'?-45:0;apply();});
    let frame=0;
    const apply=()=>{if(!frame)frame=requestAnimationFrame(()=>{frame=0;if(el.isConnected)updateMapView(el);});};
    const rebase=()=>{const ps=[...pointers.values()];base=ps.length>=2?{distance:Math.hypot(ps[0].x-ps[1].x,ps[0].y-ps[1].y),z:S.map.z,mx:S.map.x,my:S.map.y}:ps.length?{x:ps[0].x,y:ps[0].y,mx:S.map.x,my:S.map.y}:null;};
    el.addEventListener('pointerdown',e=>{if(e.target.closest('button,input,select,.map-sheet,.picker-info,.place-suggestions'))return;closeMapSearch();S.map.focusedPoi=null;pointers.set(e.pointerId,{x:e.clientX,y:e.clientY});el.setPointerCapture(e.pointerId);rebase();});
    el.addEventListener('pointermove',e=>{if(!pointers.has(e.pointerId)||!base)return;pointers.set(e.pointerId,{x:e.clientX,y:e.clientY});const ps=[...pointers.values()];if(ps.length>=2&&base.distance){const distance=Math.hypot(ps[0].x-ps[1].x,ps[0].y-ps[1].y);S.map.z=Math.max(.7,Math.min(2.5,base.z*distance/base.distance));S.map.x=base.mx*S.map.z/base.z;S.map.y=base.my*S.map.z/base.z;}else if(ps.length===1&&base.x!==undefined){S.map.x=Math.max(-700,Math.min(700,base.mx+e.clientX-base.x));S.map.y=Math.max(-800,Math.min(800,base.my+e.clientY-base.y));}apply();});
    const finish=e=>{if(!pointers.has(e.pointerId))return;pointers.delete(e.pointerId);rebase();if(!pointers.size)apply();};
    el.addEventListener('pointerup',finish);el.addEventListener('pointercancel',finish);
    el.addEventListener('wheel',e=>{if(e.target.closest('.map-sheet,.place-suggestions,input,select'))return;e.preventDefault();setMapZoom(S.map.z+(e.deltaY<0?.1:-.1));apply();},{passive:false});
  });
}
document.addEventListener('focusin',event=>{if(event.target.name==='placeQuery')showMapSuggestions();});
document.addEventListener('click',event=>{if(!event.target.closest('.map-search'))closeMapSearch();});
document.addEventListener('keydown',event=>{
  if(event.target.name!=='placeQuery')return;
  const rows=BirdUX.search(event.target.value);
  if(event.key==='Escape'){event.preventDefault();closeMapSearch();return;}
  if(event.key==='ArrowDown'||event.key==='ArrowUp'){
    event.preventDefault();X.searchIndex=BirdUX.clamp(X.searchIndex+(event.key==='ArrowDown'?1:-1),0,rows.length-1);showMapSuggestions();
    if(rows[X.searchIndex])$('#place-option-'+rows[X.searchIndex].id)?.scrollIntoView({block:'nearest'});
  }
  if(event.key==='Enter'){event.preventDefault();if(rows.length)chooseMapPlace(rows[Math.max(0,X.searchIndex)]?.id||rows[0].id);else showMapSuggestions();}
});
$('#avatar-photo-input').addEventListener('change',event=>{const file=event.target.files[0];event.target.value='';X.loadAvatar(file);});

reset();
</script>
